# Settings of the valve calibration (OpenRigs.Core DispenseCalibration), read at Start by
# src\main.bonsai. The valve line, its artefact and the behavior board's port come from the rig's
# own rig.yml, through rig-control's launch, never from here.
#
# The balance is read by eye (OpenRigs.Devices ManualBalance): after each burst the run asks for the
# weight and waits up to weighTimeoutS for it to be typed, taking that one reading (settleWindow 1).
# Each sample fires `repeats` pulses at `size` ms, then weighs the gain. Pick repeats so the gain
# per sample is at least 50 times the balance's last digit: on a 1 mg balance, 25 pulses of about
# 2 ul weigh about 50 mg.
procedure:
  samples:
    - { size: 10, repeats: 25, interPulseIntervalMs: 500 }
    - { size: 20, repeats: 25, interPulseIntervalMs: 500 }
    - { size: 40, repeats: 25, interPulseIntervalMs: 500 }
    - { size: 60, repeats: 25, interPulseIntervalMs: 500 }
    - { size: 80, repeats: 25, interPulseIntervalMs: 500 }
  xName: pulse_width
  xUnit: ms
  primingPulses: 5
  densityGPerMl: 1.0
  settleWindow: 1
  weighTimeoutS: 3600
  fit: LinearFit
  fitOrder: 2
  requireMonotone: true
