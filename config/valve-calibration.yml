# Settings of the valve calibration (OpenRigs.Core DispenseCalibration), read at Start by
# src\main.bonsai. The valve line, its artefact and the behavior board's port come from the rig's
# own rig.yml, through rig-control's launch, never from here.
#
# The balance is read by eye (OpenRigs.Devices ManualBalance): after each burst the run asks for the
# weight and waits up to weighTimeoutS for it to be typed, taking that one reading (settleWindow 1).
# Each sample fires `repeats` pulses at `size` ms, then weighs the gain. Pick repeats so the gain
# per sample is well above the balance's last digit: 100 pulses at the short widths, fewer at the
# long ones, where each pulse delivers more; widths from 20 ms (Pip, 6 Nov 2026). Pulses are 50 ms
# apart, as av-dome delivers a reward (rig.yml interPulseInterval), so the curve is measured as
# rewards are given.
procedure:
  samples:
    - { size: 20, repeats: 100, interPulseIntervalMs: 50 }
    - { size: 30, repeats: 100, interPulseIntervalMs: 50 }
    - { size: 40, repeats: 75, interPulseIntervalMs: 50 }
    - { size: 60, repeats: 50, interPulseIntervalMs: 50 }
    - { size: 80, repeats: 50, interPulseIntervalMs: 50 }
  xName: pulse_width
  xUnit: ms
  primingPulses: 5
  densityGPerMl: 1.0
  settleWindow: 1
  weighTimeoutS: 3600
  fit: LinearFit
  fitOrder: 2
  requireMonotone: true
