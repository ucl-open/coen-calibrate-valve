# Settings of the valve calibration (OpenRigs.Core DispenseCalibration), read at Start by
# src\main.bonsai. The valve line, its artefact and the behavior board's port come from the rig's
# own rig.yml, through rig-control's launch, never from here.
#
# The balance is read by eye (OpenRigs.Devices ManualBalance): after each burst the run asks for the
# weight and waits up to weighTimeoutS for it to be typed, taking that one reading (settleWindow 1).
# Each sample fires `repeats` pulses at `size` ms, then weighs the gain. Seven widths, 20 to 100 ms
# evenly spaced (to the ms), each measured 3 times, in rounds of all seven in a shuffled order (fixed
# here, the same every run), so drift over the run falls on every width alike; the fit (LinearFit)
# averages the repeats. Each width delivers in all about what 500 pulses at 20 ms do, taking volume
# as proportional to width; per round 167 at 20 ms, 101 at 33, 71 at 47, 56 at 60, 46 at 73, 38 at
# 87 and 33 at 100 (Pip, 6 Nov 2026). Pulses are 63 ms apart, 1.25 times the 50 ms av-dome leaves
# between a reward's pulses (rig.yml interPulseInterval).
procedure:
  samples:
    - { size: 60, repeats: 56, interPulseIntervalMs: 63 }  # round 1
    - { size: 47, repeats: 71, interPulseIntervalMs: 63 }
    - { size: 73, repeats: 46, interPulseIntervalMs: 63 }
    - { size: 33, repeats: 101, interPulseIntervalMs: 63 }
    - { size: 100, repeats: 33, interPulseIntervalMs: 63 }
    - { size: 20, repeats: 167, interPulseIntervalMs: 63 }
    - { size: 87, repeats: 38, interPulseIntervalMs: 63 }
    - { size: 33, repeats: 101, interPulseIntervalMs: 63 } # round 2
    - { size: 20, repeats: 167, interPulseIntervalMs: 63 }
    - { size: 100, repeats: 33, interPulseIntervalMs: 63 }
    - { size: 87, repeats: 38, interPulseIntervalMs: 63 }
    - { size: 60, repeats: 56, interPulseIntervalMs: 63 }
    - { size: 47, repeats: 71, interPulseIntervalMs: 63 }
    - { size: 73, repeats: 46, interPulseIntervalMs: 63 }
    - { size: 47, repeats: 71, interPulseIntervalMs: 63 }  # round 3
    - { size: 73, repeats: 46, interPulseIntervalMs: 63 }
    - { size: 60, repeats: 56, interPulseIntervalMs: 63 }
    - { size: 33, repeats: 101, interPulseIntervalMs: 63 }
    - { size: 100, repeats: 33, interPulseIntervalMs: 63 }
    - { size: 20, repeats: 167, interPulseIntervalMs: 63 }
    - { size: 87, repeats: 38, interPulseIntervalMs: 63 }
  xName: pulse_width
  xUnit: ms
  primingPulses: 5
  densityGPerMl: 1.0
  settleWindow: 1
  weighTimeoutS: 3600
  fit: LinearFit
  fitOrder: 2
  requireMonotone: true
