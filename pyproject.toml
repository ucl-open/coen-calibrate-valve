[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "ucl-open-coen-calibrate-valve"
description = "A library that defines a open-rigs data schema for the coen-calibrate-valve experiment."
authors = [ {name = "Pip Coen", email = "pipcoen@gmail.com"}]
license = "MIT"
requires-python = ">=3.11, <3.12"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
version = "0.0.0-rc1"
readme = {file = "README.md", content-type = "text/markdown"}

dependencies = [
  "swc-aeon>=0.2.0",
  "open-rigs",
  "pydantic-settings"
]

# [project.urls]
# Documentation = "https://open-rigs.github.io/Ucl.Open.CoenCalibrateValve/"
# Repository = "https://github.com/OpenRigs/Ucl.Open.CoenCalibrateValve/"
# Issues = "https://github.com/OpenRigs/Ucl.Open.CoenCalibrateValve/issues"
# Changelog = "https://github.com/OpenRigs/Ucl.Open.CoenCalibrateValve/releases"
[project.scripts]
coen-calibrate-valve = "ucl_open_coen_calibrate_valve.cli:main"
regenerate-schemas = "ucl_open_coen_calibrate_valve.regenerate:main"

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.codespell]
skip = '.git,*.pdf,*.svg,./bonsai,*.bonsai,./docs/_build,uv.lock,*Generated.cs'
ignore-words-list = 'nd'

[tool.uv]
required-version = '>=0.8.4'

[tool.uv.sources]
open-rigs = {git = "https://github.com/open-rigs/open-rigs", branch = "main"}
swc-aeon = { git = "https://github.com/SainsburyWellcomeCentre/aeon_api.git", branch = "main" }